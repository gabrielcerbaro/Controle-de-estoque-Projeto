<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque | Login</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="stylesheet" href="css/login.css?v=7">
</head>
<body class="pagina-login">
    <div class="card-login" id="cardLogin">
        <img src="assets/logo.png" alt="Estoque" class="logo-login">

        <form id="formLogin">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <p class="mensagem-erro" id="mensagemErro"></p>

            <button type="submit" id="botaoEntrar">Entrar</button>
        </form>
    </div>

    <script src="js/login.js?v=7"></script>
</body>
</html>
