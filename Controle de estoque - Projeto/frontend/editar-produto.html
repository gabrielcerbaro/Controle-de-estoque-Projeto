<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque | Editar produto</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="stylesheet" href="css/entrada.css?v=7">
    <link rel="stylesheet" href="css/editar-produto.css?v=7">
</head>
<body class="pagina-app apareceSuave">
    <header class="cabecalho-app">
        <img src="assets/logo.png" alt="Estoque" class="logo-topo">
        <div class="area-usuario">
            <a href="dashboard.html" class="botao-icone">← Voltar</a>
        </div>
    </header>

    <main class="conteudo-estreito">
        <h1>Editar produto</h1>
        <p id="codigoProduto" style="color:#5A6B7A;"></p>

        <form id="formEditarProduto">
            <div class="pergunta-obrigatoria">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="pergunta-obrigatoria">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" required>
            </div>
            <div class="pergunta-obrigatoria">
                <label for="quantidade">Quantidade em estoque</label>
                <input type="number" id="quantidade" min="0" required>
            </div>
            <div class="pergunta-obrigatoria">
                <label for="valorUnitario">Valor unitário (custo)</label>
                <input type="number" id="valorUnitario" min="0" step="0.01" required>
            </div>
            <div class="pergunta-obrigatoria">
                <label for="valorTotalCompra">Valor total de compra</label>
                <input type="number" id="valorTotalCompra" min="0" step="0.01">
            </div>
            <div class="pergunta-obrigatoria">
                <label for="pesoBruto">Peso bruto (kg)</label>
                <input type="number" id="pesoBruto" min="0" step="0.001">
            </div>

            <p class="mensagem-erro" id="mensagemEdicao"></p>

            <div class="botoes-navegacao">
                <a href="dashboard.html" class="botao-acao">Cancelar</a>
                <button type="submit" class="botao-acao botao-acao-primario" id="botaoSalvarEdicao">Salvar alterações</button>
            </div>
        </form>

        <button type="button" id="botaoExcluirProduto" class="botao-excluir">Excluir este produto</button>

        <div id="caixaConfirmacaoExclusao" class="caixa-confirmacao-exclusao" style="display:none;">
            <p><strong>Atenção:</strong> isso vai apagar o produto <strong id="nomeParaConfirmar"></strong> e <strong>todo o histórico de entradas e saídas dele</strong>, inclusive das partes do financeiro. Essa ação não pode ser desfeita.</p>
            <label for="confirmarNomeExclusao">Pra confirmar, digite o nome do produto exatamente como está escrito acima:</label>
            <input type="text" id="confirmarNomeExclusao" autocomplete="off">
            <button type="button" id="botaoConfirmarExclusaoDefinitiva" class="botao-excluir" disabled>Confirmar exclusão definitiva</button>
        </div>
    </main>

    <script src="js/editar-produto.js?v=7"></script>
</body>
</html>
